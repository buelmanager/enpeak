name: flu
description: "AI English Learning App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5
  record: ^6.2.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.4
